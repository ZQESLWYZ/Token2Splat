[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token2splat"
version = "0.1.0"
description = "Canonical patch tokens for class-conditional 3D Gaussian Splatting generation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "torch>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["token2splat", "token2splat.data", "token2splat.eval", "token2splat.inference", "token2splat.io", "token2splat.models", "token2splat.render", "token2splat.tokenizer", "token2splat.train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
